<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Travel Explorer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
<div class="container">
<a class="navbar-brand fw-bold" href="index.html">🌍 Travel Explorer</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse justify-content-end" id="navbarNav">
<ul class="navbar-nav">
<li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
<li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
<li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
<li class="nav-item"><a class="nav-link active" href="#">Contact</a></li>
</ul>
</div>
</div>
</nav>

<header class="vh-50 d-flex align-items-center justify-content-center text-center text-white bg-primary mb-5" style="margin-top: 56px;">
<div data-aos="fade-up">
<h1 class="display-4 fw-bold">Contact Us</h1>
<p class="lead">Send us your questions or suggestions.</p>
</div>
</header>

<section class="container py-5" data-aos="fade-up">
<form id="contact-form" class="mx-auto" style="max-width:600px;">
  <div class="mb-3"><input type="text" name="name" class="form-control" placeholder="Your Name" required></div>
  <div class="mb-3"><input type="email" name="email" class="form-control" placeholder="Your Email" required></div>
  <div class="mb-3"><textarea name="message" class="form-control" rows="5" placeholder="Your Message" required></textarea></div>
  <button type="submit" class="btn btn-primary w-100">Send Message</button>
</form>
</section>

<footer class="text-center py-4 bg-light mt-5">
<p class="mb-0">&copy; 2025 Travel Explorer</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="js/main.js"></script>
<script>AOS.init();</script>
</body>
</html>
